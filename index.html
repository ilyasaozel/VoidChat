<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#075e54">
<title>VoidChat</title>
<style>
:root{--green:#075e54;--green2:#128c7e;--bg:#efeae2;--ink:#111b21;--muted:#667781;--line:#e9edef}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7f7;color:var(--ink)}
button,input{font:inherit}button{cursor:pointer;border:0}
#auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(145deg,#064e46,#128c7e)}
.auth-card{background:white;width:100%;max-width:420px;border-radius:22px;padding:26px;box-shadow:0 18px 55px #002b2840}
.brand{font-size:30px;font-weight:800;color:var(--green);letter-spacing:-1px}.sub{color:var(--muted);margin:7px 0 24px}
.field{width:100%;padding:15px;border:1px solid #d7dfe2;border-radius:12px;margin:7px 0;outline:none}.field:focus{border-color:var(--green2)}
.primary{background:var(--green);color:#fff;padding:14px 18px;border-radius:12px;width:100%;font-weight:700;margin-top:10px}.switch{background:none;color:var(--green);padding:14px;width:100%}
#error{color:#b3261e;font-size:13px;min-height:18px;margin-top:8px}
#app{display:none;height:100dvh;max-width:760px;margin:auto;background:white;position:relative;overflow:hidden;box-shadow:0 0 25px #00000010}
.top{height:62px;background:var(--green);color:white;display:flex;align-items:center;padding:0 16px;gap:12px}
.logo{font-weight:800;font-size:22px;flex:1}.top button{background:none;color:white;font-size:22px;padding:8px}
.tabs{height:48px;background:var(--green);display:flex;color:#d2e8e5}
.tabs button{flex:1;background:none;color:inherit;font-weight:700;border-bottom:3px solid transparent}
.tabs button.active{color:white;border-color:#fff}
.page{height:calc(100dvh - 110px);overflow:auto}.search{padding:12px;background:#fff;position:sticky;top:0}
.search input{background:#f0f2f3;border:0;border-radius:24px;width:100%;padding:12px 16px;outline:none}
.item{display:flex;align-items:center;gap:13px;padding:12px 15px;border-bottom:1px solid var(--line);width:100%;background:#fff;text-align:left}
.avatar{width:48px;height:48px;border-radius:50%;background:#d9eee9;color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.info{min-width:0;flex:1}.name{font-weight:700;margin-bottom:5px}.preview{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);padding:55px 25px;line-height:1.5}
#chat{display:none;position:absolute;inset:0;background:var(--bg);z-index:5;flex-direction:column}
.chat-head{height:62px;background:var(--green);color:white;display:flex;align-items:center;gap:10px;padding:0 10px}
.chat-head button{background:none;color:white;font-size:24px;padding:8px}.chat-person{font-weight:700;flex:1}
#messages{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:82%;padding:9px 11px 6px;border-radius:12px;background:white;box-shadow:0 1px 1px #00000012;overflow-wrap:anywhere;align-self:flex-start}
.bubble.mine{background:#d9fdd3;align-self:flex-end}.stamp{text-align:right;color:#667781;font-size:10px;margin-top:4px}
.composer{display:flex;gap:8px;padding:9px;background:#f0f2f3;align-items:center}
.composer input{flex:1;border:0;border-radius:24px;padding:13px 16px;outline:none;min-width:0}
.send{width:46px;height:46px;border-radius:50%;background:var(--green);color:white;font-size:20px}
#profile{padding:22px}.profile-avatar{width:86px;height:86px;font-size:30px;margin:10px auto 18px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:18px}
</style>
</head>
<body>
<section id="auth">
 <div class="auth-card">
  <div class="brand">◉ VoidChat</div><div class="sub">Mesajlaşmanın yeni alanı.</div>
  <div id="authTitle" style="font-size:20px;font-weight:700">Hesabına giriş yap</div>
  <input id="email" class="field" type="email" placeholder="E-posta adresi" autocomplete="email">
  <input id="password" class="field" type="password" placeholder="Şifre (en az 6 karakter)" autocomplete="current-password">
  <div id="nameWrap" style="display:none"><input id="displayName" class="field" placeholder="Görünen adın"></div>
  <button id="authBtn" class="primary">Giriş yap</button>
  <button id="switchBtn" class="switch">Hesabın yok mu? Kayıt ol</button>
  <div id="error"></div>
  <div class="note">VoidChat hesabınla giriş yap. Şifreni kimseyle paylaşma.</div>
 </div>
</section>
<main id="app">
 <header class="top"><div class="logo">◉ VoidChat</div><button id="newChat" aria-label="Yeni sohbet">＋</button><button id="profileBtn" aria-label="Profil">⋮</button></header>
 <nav class="tabs"><button class="active" data-tab="chats">SOHBETLER</button><button data-tab="people">KİŞİLER</button><button data-tab="profile">PROFİL</button></nav>
 <section id="chatsPage" class="page"><div class="search"><input id="chatSearch" placeholder="Sohbetlerde ara"></div><div id="chatList"></div></section>
 <section id="peoplePage" class="page" style="display:none"><div class="search"><input id="peopleSearch" placeholder="Kullanıcı adı ara"></div><div id="peopleList" class="empty">Kişi bulmak için kullanıcı adını yaz.</div></section>
 <section id="profilePage" class="page" style="display:none"><div id="profile" class="empty"></div></section>
 <section id="chat">
  <header class="chat-head"><button id="back">‹</button><div class="avatar" id="chatAvatar">V</div><div class="chat-person" id="chatName">Sohbet</div></header>
  <div id="messages"></div>
  <form id="composer" class="composer"><input id="messageInput" maxlength="2000" placeholder="Mesaj yaz..." autocomplete="off"><button class="send" type="submit">➤</button></form>
 </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
 apiKey: "AIzaSyCvJWVPrwGyL0chyoKAc-WyAfcJyKeKVSc",
 authDomain: "vibechat-3c80a.firebaseapp.com",
 projectId: "vibechat-3c80a",
 storageBucket: "vibechat-3c80a.firebasestorage.app",
 messagingSenderId: "1038838384524",
 appId: "1:1038838384524:web:9a06900bea6a5931a1b8a9",
 measurementId: "G-7M0TTV317K"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
let user=null, profile=null, signup=false, activeChat=null, activePeer=null, unsubChats=null, unsubMessages=null;
const $=id=>document.getElementById(id);
function showError(t){$('error').textContent=t}
function initials(s){return (s||'V').trim().slice(0,1).toUpperCase()}
function safeDate(ts){try{return ts&&ts.toDate?ts.toDate().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):''}catch(e){return ''}}
$('switchBtn').onclick=()=>{signup=!signup;$('authTitle').textContent=signup?'Yeni hesap oluştur':'Hesabına giriş yap';$('authBtn').textContent=signup?'Kayıt ol':'Giriş yap';$('switchBtn').textContent=signup?'Zaten hesabın var mı? Giriş yap':'Hesabın yok mu? Kayıt ol';$('nameWrap').style.display=signup?'block':'none';showError('')};
$('authBtn').onclick=async()=>{
 showError('');
 const email=$('email').value.trim(), pass=$('password').value, name=$('displayName').value.trim();
 if(!email||!pass){showError('E-posta ve şifre gerekli.');return}
 if(pass.length<6){showError('Şifre en az 6 karakter olmalı.');return}
 $('authBtn').disabled=true;
 try{
  if(signup){
   if(!name){showError('Görünen adını yaz.');return}
   const cred=await auth.createUserWithEmailAndPassword(email,pass);
   await db.collection('users').doc(cred.user.uid).set({displayName:name,username:name.toLowerCase().replace(/\s+/g,''),createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  }else{await auth.signInWithEmailAndPassword(email,pass)}
 }catch(e){showError(e.message)}
 finally{$('authBtn').disabled=false}
};
auth.onAuthStateChanged(async u=>{
 user=u;
 if(!u){$('auth').style.display='flex';$('app').style.display='none';if(unsubChats)unsubChats();return}
 try{
  const ref=db.collection('users').doc(u.uid), snap=await ref.get();
  if(!snap.exists){await ref.set({displayName:u.email.split('@')[0],username:u.email.split('@')[0].toLowerCase(),createdAt:firebase.firestore.FieldValue.serverTimestamp()})}
  profile=(await ref.get()).data();
  $('auth').style.display='none';$('app').style.display='block';renderProfile();listenChats();switchTab('chats');
 }catch(e){$('auth').style.display='flex';$('app').style.display='none';showError('Profil yüklenemedi: '+e.message)}
});
function switchTab(tab){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 $('chatsPage').style.display=tab==='chats'?'block':'none';$('peoplePage').style.display=tab==='people'?'block':'none';$('profilePage').style.display=tab==='profile'?'block':'none';
 if(tab==='profile')renderProfile();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
$('profileBtn').onclick=()=>switchTab('profile');
function renderProfile(){
 if(!profile)return;
 $('profile').innerHTML='';
 const av=document.createElement('div');av.className='avatar profile-avatar';av.textContent=initials(profile.displayName);
 const title=document.createElement('h2');title.textContent=profile.displayName||'VoidChat kullanıcısı';
 const handle=document.createElement('p');handle.textContent='@'+(profile.username||'');
 const email=document.createElement('p');email.textContent=user.email;
 const out=document.createElement('button');out.className='primary';out.textContent='Çıkış yap';out.onclick=()=>auth.signOut();
 const note=document.createElement('p');note.className='note';note.textContent='Bu ilk sürümde profil adı ve e-posta hesabına bağlıdır.';
 $('profile').append(av,title,handle,email,out,note);
}
function listenChats(){
 if(unsubChats)unsubChats();
 unsubChats=db.collection('conversations').where('members','array-contains',user.uid).onSnapshot(s=>{
  const list=$('chatList');list.innerHTML='';
  if(s.empty){list.innerHTML='<div class="empty">Henüz sohbetin yok.<br>Kişiler sekmesinden bir kullanıcı ara.</div>';return}
  const docs=s.docs.sort((a,b)=>(b.data().updatedAt?.toMillis?.()||0)-(a.data().updatedAt?.toMillis?.()||0));
  docs.forEach(doc=>{
   const d=doc.data(), peer=d.members.find(x=>x!==user.uid), row=document.createElement('button');row.className='item';
   const av=document.createElement('div');av.className='avatar';av.textContent=initials(d.memberNames?.[peer]||'V');
   const info=document.createElement('div');info.className='info';
   const nm=document.createElement('div');nm.className='name';nm.textContent=d.memberNames?.[peer]||'VoidChat kullanıcısı';
   const pv=document.createElement('div');pv.className='preview';pv.textContent=d.lastMessage||'Sohbeti aç';
   info.append(nm,pv);row.append(av,info);row.onclick=()=>openChat(doc.id,peer,d.memberNames?.[peer]||'Sohbet');list.append(row);
  });
 },e=>console.error(e));
}
$('peopleSearch').oninput=async()=>{
 const q=$('peopleSearch').value.trim().toLowerCase(), list=$('peopleList');
 if(q.length<2){list.className='empty';list.textContent='En az 2 karakter yaz.';return}
 try{
  const s=await db.collection('users').orderBy('username').startAt(q).endAt(q+'\uf8ff').limit(20).get();
  list.innerHTML='';list.className='';
  const found=s.docs.filter(d=>d.id!==user.uid);
  if(!found.length){list.className='empty';list.textContent='Kullanıcı bulunamadı.';return}
  found.forEach(d=>{
   const p=d.data(),row=document.createElement('button');row.className='item';
   const av=document.createElement('div');av.className='avatar';av.textContent=initials(p.displayName);
   const info=document.createElement('div');info.className='info';
   const nm=document.createElement('div');nm.className='name';nm.textContent=p.displayName||'Kullanıcı';
   const un=document.createElement('div');un.className='preview';un.textContent='@'+(p.username||'');
   info.append(nm,un);row.append(av,info);row.onclick=()=>startChat(d.id,p.displayName||'Kullanıcı');list.append(row);
  });
 }catch(e){list.className='empty';list.textContent='Arama hatası: '+e.message}
};
async function startChat(peer,name){
 try{
  const existing=await db.collection('conversations').where('members','array-contains',user.uid).get();
  const match=existing.docs.find(d=>d.data().members.includes(peer));
  if(match){openChat(match.id,peer,name);return}
  const id=[user.uid,peer].sort().join('_');
  const names={};names[user.uid]=profile.displayName;names[peer]=name;
  await db.collection('conversations').doc(id).set({members:[user.uid,peer].sort(),memberNames:names,lastMessage:'',createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  openChat(id,peer,name);
 }catch(e){alert('Sohbet açılamadı: '+e.message)}
}
function openChat(id,peer,name){
 activeChat=id;activePeer=peer;$('chatName').textContent=name;$('chatAvatar').textContent=initials(name);$('chat').style.display='flex';
 if(unsubMessages)unsubMessages();
 unsubMessages=db.collection('conversations').doc(id).collection('messages').orderBy('createdAt').onSnapshot(s=>{
  const box=$('messages');box.innerHTML='';
  s.forEach(doc=>{
   const d=doc.data(),b=document.createElement('div');b.className='bubble'+(d.senderId===user.uid?' mine':'');
   const t=document.createElement('div');t.textContent=d.text;
   const stamp=document.createElement('div');stamp.className='stamp';stamp.textContent=safeDate(d.createdAt);
   b.append(t,stamp);box.append(b);
  });box.scrollTop=box.scrollHeight;
 },e=>console.error(e));
}
$('back').onclick=()=>{$('chat').style.display='none';activeChat=null;if(unsubMessages)unsubMessages()};
$('composer').onsubmit=async e=>{
 e.preventDefault();const text=$('messageInput').value.trim();if(!text||!activeChat)return;
 $('messageInput').value='';
 try{
  const conv=db.collection('conversations').doc(activeChat);
  await conv.collection('messages').add({senderId:user.uid,text,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  await conv.update({lastMessage:text,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
 }catch(err){alert('Mesaj gönderilemedi: '+err.message);$('messageInput').value=text}
};
$('newChat').onclick=()=>switchTab('people');
$('chatSearch').oninput=()=>{
 const q=$('chatSearch').value.toLowerCase();
 document.querySelectorAll('#chatList .item').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'flex':'none');
};
</script>
</body>
</html>
