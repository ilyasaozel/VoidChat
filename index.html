
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoidChat</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;
 justify-content:center;align-items:center;
 background:radial-gradient(circle at top,#17264a,#080b16 65%);
 font-family:Arial;color:white;padding:20px
}
.card{
 width:100%;max-width:390px;padding:32px 24px;
 background:#111827;border:1px solid #263653;
 border-radius:22px;text-align:center;
 box-shadow:0 15px 50px #0008
}
.logo{font-size:36px;font-weight:900;color:#63a8ff}
.sub{color:#9caac2;margin:10px 0 28px}
input{
 width:100%;padding:16px;margin:9px 0;
 border:1px solid #34445e;border-radius:12px;
 background:#0b1220;color:white;font-size:16px;
 outline:none
}
input:focus{border-color:#559cff}
button{
 width:100%;padding:15px;margin-top:12px;
 border:0;border-radius:12px;
 background:linear-gradient(90deg,#287cff,#7655ff);
 color:white;font-size:16px;font-weight:bold
}
.secondary{background:#26344d}
#message{font-size:14px;color:#ff8585;margin-top:16px}
</style>
</head>
<body>
<div class="card">
 <div class="logo">VoidChat</div>
 <div class="sub">Yeni nesil mesajlaşma dünyası</div>

 <input id="email" type="email" placeholder="Gmail / E-posta adresi">
 <input id="password" type="password" placeholder="Şifre">

 <button onclick="login()">GİRİŞ YAP</button>
 <button class="secondary" onclick="register()">KAYIT OL</button>
 <div id="message"></div>
</div>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {getAuth,signInWithEmailAndPassword,
createUserWithEmailAndPassword}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// BURAYA FIREBASE PROJE BİLGİLERİNİ YAZ
const firebaseConfig = {
 apiKey: "BURAYA_API_KEY",
 authDomain: "BURAYA_AUTH_DOMAIN",
 projectId: "BURAYA_PROJECT_ID",
 storageBucket: "BURAYA_STORAGE_BUCKET",
 messagingSenderId: "BURAYA_SENDER_ID",
 appId: "BURAYA_APP_ID"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

const email=document.getElementById("email");
const password=document.getElementById("password");
const message=document.getElementById("message");

window.login=async()=>{
 try{
  message.style.color="#8dffae";
  message.textContent="Giriş yapılıyor...";
  await signInWithEmailAndPassword(auth,email.value.trim(),password.value);
  message.textContent="Giriş başarılı!";
 }catch(e){
  message.style.color="#ff8585";
  message.textContent=errorText(e.code);
 }
};

window.register=async()=>{
 try{
  message.style.color="#8dffae";
  message.textContent="Hesap oluşturuluyor...";
  await createUserWithEmailAndPassword(auth,email.value.trim(),password.value);
  message.textContent="Hesabın oluşturuldu!";
 }catch(e){
  message.style.color="#ff8585";
  message.textContent=errorText(e.code);
 }
};

function errorText(code){
 const errors={
  "auth/email-already-in-use":"Bu e-posta zaten kayıtlı. Giriş yapmayı dene.",
  "auth/invalid-email":"Geçerli bir e-posta adresi yaz.",
  "auth/weak-password":"Şifren en az 6 karakter olmalı.",
  "auth/invalid-credential":"E-posta veya şifre hatalı.",
  "auth/network-request-failed":"İnternet bağlantını kontrol et."
 };
 return errors[code]||"Bir hata oluştu: "+code;
}
</script>
</body>
</html>
